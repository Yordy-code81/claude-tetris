<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
  <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
    <span id="theme-label">Modo claro</span>
    <span class="switch-track"><span class="switch-thumb"></span></span>
  </button>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="overlay-records" class="records hidden">
          <p id="new-record-badge" class="new-record hidden">¡Nuevo récord!</p>
          <form id="record-form" class="record-form hidden" autocomplete="off">
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" aria-label="Tu nombre" />
            <button id="save-record-btn" type="submit">Guardar</button>
          </form>
          <table class="records-table">
            <tbody id="overlay-records-body"></tbody>
          </table>
          <p class="records-extra">Mejor combo: <span id="overlay-best-combo">0</span> · Líneas máx.: <span id="overlay-max-lines">0</span></p>
        </div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-screen" class="overlay">
      <div class="overlay-box">
        <p class="start-title">¿LISTO?</p>
        <div class="records">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table class="records-table">
            <tbody id="start-records-body"></tbody>
          </table>
          <p class="records-extra">Mejor combo: <span id="start-best-combo">0</span> · Líneas máx.: <span id="start-max-lines">0</span></p>
        </div>
        <button id="play-btn" type="button">Jugar</button>
        <p class="start-hint">o pulsa <kbd>Enter</kbd></p>
        <button id="reset-records-btn" type="button">Borrar records</button>
      </div>
    </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
