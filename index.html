<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    try {
      if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light';
      // sin variables globales: game.js declara `let skin` y chocaría con un `var skin`
      if (localStorage.getItem('skin')) document.documentElement.dataset.skin = localStorage.getItem('skin');
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
  <div class="topbar">
    <label class="skin-picker">
      <span>Skin</span>
      <select id="skin-select" aria-label="Apariencia de los bloques"></select>
    </label>
    <button id="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">
      <span id="theme-label">Modo claro</span>
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </button>
  </div>
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="record-form" class="record-form hidden" autocomplete="off">
          <label for="record-name" id="record-rank">¡Nuevo récord!</label>
          <div class="record-form-row">
            <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" spellcheck="false" />
            <button type="submit" id="record-save-btn">Guardar</button>
          </div>
        </form>

        <div id="records" class="records hidden">
          <span class="label">MEJORES PUNTUACIONES</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <div class="records-extra">
            <div id="best-combo-box" class="records-stat">
              <span class="label">MEJOR COMBO</span>
              <span id="best-combo">0</span>
            </div>
            <div id="max-lines-box" class="records-stat">
              <span class="label">LÍNEAS MÁX.</span>
              <span id="max-lines">0</span>
            </div>
          </div>
          <button id="reset-records-btn" type="button">Borrar récords</button>
        </div>

        <div class="menu">
          <button id="resume-btn" class="menu-btn primary" type="button">Reanudar</button>
          <button id="restart-btn" class="menu-btn" type="button">Jugar</button>
          <button id="controls-btn" class="menu-btn" type="button" aria-expanded="false" aria-controls="controls-list">Ver controles</button>
          <ul id="controls-list" class="menu-controls" hidden>
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Espacio</kbd></span> caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa</li>
          </ul>
          <label class="menu-level" for="start-level">
            Nivel inicial
            <select id="start-level"></select>
          </label>
          <p class="menu-hint">Se aplica en la próxima partida</p>
        </div>
      </div>
    </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
